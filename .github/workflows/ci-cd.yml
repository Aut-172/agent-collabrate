name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test with PostgreSQL Testcontainers
        run: mvn -s .mvn/settings.xml --batch-mode verify

  frontend-test:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  publish-images:
    name: Publish images to Alibaba Cloud ACR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate and normalize ACR image namespace
        id: image
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ACR_REGISTRY"
          test -n "$ACR_NAMESPACE"
          test -n "$ACR_USERNAME"
          test -n "$ACR_PASSWORD"
          registry="${ACR_REGISTRY,,}"
          registry="${registry%/}"
          namespace="${ACR_NAMESPACE,,}"
          namespace="${namespace#/}"
          namespace="${namespace%/}"
          test -n "$registry"
          test -n "$namespace"
          printf 'registry=%s\n' "$registry" >> "$GITHUB_OUTPUT"
          printf 'namespace=%s/%s\n' "$registry" "$namespace" >> "$GITHUB_OUTPUT"
      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build backend image with Docker
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.namespace }}/agent-collab-backend"
          docker build \
            --tag "$image:${GITHUB_SHA}" \
            --tag "$image:latest" \
            --file Dockerfile .
      - name: Push backend image to ACR
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.namespace }}/agent-collab-backend"
          timeout 30m docker push "$image:${GITHUB_SHA}"
          timeout 30m docker push "$image:latest"
      - name: Build frontend image with Docker
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.namespace }}/agent-collab-frontend"
          docker build \
            --tag "$image:${GITHUB_SHA}" \
            --tag "$image:latest" \
            --file frontend/Dockerfile frontend
      - name: Push frontend image to ACR
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.namespace }}/agent-collab-frontend"
          timeout 30m docker push "$image:${GITHUB_SHA}"
          timeout 30m docker push "$image:latest"

  deploy-production:
    name: Deploy to ECS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-images
    runs-on: ubuntu-latest
    environment: production
    env:
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_SSH_PORT: ${{ secrets.ECS_SSH_PORT || '22' }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      ACR_PULL_REGISTRY: ${{ secrets.ACR_PULL_REGISTRY }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
      DEPLOY_PATH: /opt/agent-collab
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH and image environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ECS_HOST"
          test -n "$ECS_USER"
          test -n "$ECS_SSH_PORT"
          test -n "$ACR_USERNAME"
          test -n "$ACR_PASSWORD"
          test -n "$ACR_PULL_REGISTRY"
          test -n "$ACR_NAMESPACE"
          install -m 700 -d "$HOME/.ssh" .deploy
          ssh-keyscan -p "$ECS_SSH_PORT" -H "$ECS_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s\n' '${{ secrets.ECS_SSH_KEY }}' > .deploy/deploy_key
          chmod 600 .deploy/deploy_key
          pull_registry="${ACR_PULL_REGISTRY,,}"
          pull_registry="${pull_registry%/}"
          namespace="${ACR_NAMESPACE,,}"
          namespace="${namespace#/}"
          namespace="${namespace%/}"
          printf 'IMAGE_NAMESPACE=%s/%s\nIMAGE_TAG=%s\n' \
            "$pull_registry" "$namespace" "$GITHUB_SHA" > .deploy/image.env
      - name: Create ECS deployment directory
        run: |
          ssh -i .deploy/deploy_key -o BatchMode=yes -p "$ECS_SSH_PORT" \
            "$ECS_USER@$ECS_HOST" "mkdir -p '$DEPLOY_PATH'"
      - name: Upload deployment files
        run: |
          scp -i .deploy/deploy_key -o BatchMode=yes -P "$ECS_SSH_PORT" \
            compose.prod.yaml Caddyfile Caddyfile.http .deploy/image.env \
            "$ECS_USER@$ECS_HOST:$DEPLOY_PATH/"
      - name: Log in to ACR and restart services
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ACR_PASSWORD" | ssh -i .deploy/deploy_key -o BatchMode=yes -p "$ECS_SSH_PORT" \
            "$ECS_USER@$ECS_HOST" "docker login '$ACR_PULL_REGISTRY' --username '$ACR_USERNAME' --password-stdin"
          ssh -i .deploy/deploy_key -o BatchMode=yes -p "$ECS_SSH_PORT" "$ECS_USER@$ECS_HOST" \
            "bash -s -- '$DEPLOY_PATH'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          deploy_path="$1"
          cd "$deploy_path"
          test -f .env || { echo 'Missing /opt/agent-collab/.env; create it on ECS with DB/JWT/domain settings.' >&2; exit 1; }
          sed -i 's/\r$//' .env
          grep -Eq '^DB_PASSWORD=.+$' .env || { echo 'Missing DB_PASSWORD in ECS .env.' >&2; exit 1; }
          grep -Eq '^JWT_SECRET=.+$' .env || { echo 'Missing JWT_SECRET in ECS .env.' >&2; exit 1; }
          deploy_domain="$(sed -n 's/^DEPLOY_DOMAIN=//p' .env | head -n 1)"
          test -n "$deploy_domain" || { echo 'Missing DEPLOY_DOMAIN in ECS .env.' >&2; exit 1; }
          if [[ "$deploy_domain" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            test -f Caddyfile.http || { echo 'Missing Caddyfile.http for temporary IP deployment.' >&2; exit 1; }
            cp Caddyfile.http Caddyfile.runtime
            echo 'Using temporary HTTP mode for IPv4 DEPLOY_DOMAIN.'
          else
            grep -Eq '^ACME_EMAIL=.+$' .env || { echo 'Missing ACME_EMAIL in ECS .env for domain HTTPS deployment.' >&2; exit 1; }
            test -f Caddyfile || { echo 'Missing Caddyfile for domain HTTPS deployment.' >&2; exit 1; }
            cp Caddyfile Caddyfile.runtime
            echo 'Using HTTPS mode for domain DEPLOY_DOMAIN.'
          fi
          chmod 600 Caddyfile.runtime
          tmp_env="$(mktemp)"
          awk '!/^IMAGE_NAMESPACE=|^IMAGE_TAG=/' .env > "$tmp_env"
          cat image.env >> "$tmp_env"
          chmod 600 "$tmp_env"
          mv "$tmp_env" .env
          docker compose --env-file .env -f compose.prod.yaml pull
          docker compose --env-file .env -f compose.prod.yaml up -d --remove-orphans
          docker compose --env-file .env -f compose.prod.yaml ps
          curl --fail --show-error --silent --retry 12 --retry-delay 5 http://127.0.0.1/healthz
          REMOTE_SCRIPT
      - name: Verify public endpoint
        shell: bash
        run: |
          set -euo pipefail
          deploy_domain="$(ssh -i .deploy/deploy_key -o BatchMode=yes -p "$ECS_SSH_PORT" \
            "$ECS_USER@$ECS_HOST" "sed -n 's/^DEPLOY_DOMAIN=//p' '$DEPLOY_PATH/.env' | head -n 1")"
          test -n "$deploy_domain"
          if [[ "$deploy_domain" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo 'Verifying temporary HTTP endpoint.'
            curl --fail --show-error --silent --location \
              --retry 24 --retry-delay 5 \
              "http://${deploy_domain}/healthz"
          else
            echo 'Verifying public HTTPS endpoint.'
            curl --fail --show-error --silent --location \
              --retry 24 --retry-delay 5 \
              --resolve "${deploy_domain}:443:${ECS_HOST}" \
              "https://${deploy_domain}/healthz"
          fi
