name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test with PostgreSQL Testcontainers
        run: mvn -s .mvn/settings.xml --batch-mode verify

  frontend-test:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  publish-images:
    name: Publish container images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Normalize image namespace
        id: image
        shell: bash
        run: echo "namespace=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.namespace }}/agent-collab-backend:${{ github.sha }}
            ${{ steps.image.outputs.namespace }}/agent-collab-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.namespace }}/agent-collab-frontend:${{ github.sha }}
            ${{ steps.image.outputs.namespace }}/agent-collab-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-production:
    name: Deploy production VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH and deployment environment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          PROD_GIT_TOKEN: ${{ secrets.PROD_GIT_TOKEN }}
          PROD_CI_WEBHOOK_SECRET: ${{ secrets.PROD_CI_WEBHOOK_SECRET }}
          PROD_AGENT_PROVIDER: ${{ secrets.PROD_AGENT_PROVIDER }}
          PROD_AGENT_API_KEY: ${{ secrets.PROD_AGENT_API_KEY }}
          PROD_AGENT_MODEL: ${{ secrets.PROD_AGENT_MODEL }}
          PROD_DEPLOY_DOMAIN: ${{ secrets.PROD_DEPLOY_DOMAIN }}
          PROD_ACME_EMAIL: ${{ secrets.PROD_ACME_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$GHCR_USERNAME"
          test -n "$GHCR_TOKEN"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$PROD_DB_PASSWORD"
          test -n "$PROD_JWT_SECRET"
          test -n "$PROD_DEPLOY_DOMAIN"
          test -n "$PROD_ACME_EMAIL"
          install -m 700 -d "$HOME/.ssh" .deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s\n' "$DEPLOY_SSH_KEY" > .deploy/deploy_key
          chmod 600 .deploy/deploy_key
          cat > .deploy/.env <<EOF
          IMAGE_NAMESPACE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}
          IMAGE_TAG=${GITHUB_SHA}
          DEPLOY_DOMAIN=${PROD_DEPLOY_DOMAIN}
          ACME_EMAIL=${PROD_ACME_EMAIL}
          DB_NAME=agent_collab
          DB_USERNAME=agent_collab
          DB_PASSWORD=${PROD_DB_PASSWORD}
          JWT_SECRET=${PROD_JWT_SECRET}
          GIT_PROVIDER=github
          GIT_API_URL=https://api.github.com
          GIT_TOKEN=${PROD_GIT_TOKEN}
          CI_WEBHOOK_SECRET=${PROD_CI_WEBHOOK_SECRET}
          AGENT_PROVIDER=${PROD_AGENT_PROVIDER:-unconfigured}
          AGENT_API_URL=https://api.openai.com/v1/responses
          AGENT_API_KEY=${PROD_AGENT_API_KEY}
          AGENT_MODEL=${PROD_AGENT_MODEL}
          AGENT_DISABLE_RESPONSE_STORAGE=true
          AGENT_NETWORK_ACCESS=enabled
          AGENT_TIMEOUT_SECONDS=120
          AGENT_MAX_OUTPUT_TOKENS=12000
          AGENT_RETRY_DELAY=10000
          AGENT_RETRY_MAX_DELAY_MS=120000
          AGENT_RETRY_JITTER_RATIO=0.25
          AGENT_MAX_ATTEMPTS=2
          AGENT_DIAGNOSTICS_ENABLED=false
          EOF
          sed -i 's/^          //' .deploy/.env
      - name: Create deployment directory
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: ssh -i .deploy/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
      - name: Upload deployment files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          scp -i .deploy/deploy_key -P "$DEPLOY_PORT" compose.prod.yaml Caddyfile \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          scp -i .deploy/deploy_key -P "$DEPLOY_PORT" .deploy/.env \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.env"
      - name: Pull images and restart services
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -i .deploy/deploy_key -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"
          ssh -i .deploy/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && docker compose --env-file .env -f compose.prod.yaml pull && docker compose --env-file .env -f compose.prod.yaml up -d --remove-orphans && docker compose --env-file .env -f compose.prod.yaml ps"
      - name: Verify public HTTPS endpoint
        env:
          DEPLOY_DOMAIN: ${{ secrets.PROD_DEPLOY_DOMAIN }}
        run: curl --fail --show-error --silent --retry 12 --retry-delay 5 "https://${DEPLOY_DOMAIN}/healthz"
