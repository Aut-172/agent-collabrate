services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-agent_collab}
      POSTGRES_USER: ${DB_USERNAME:-agent_collab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql --host=127.0.0.1 --username=\"$${POSTGRES_USER}\" --dbname=\"$${POSTGRES_DB}\" --no-password --command='SELECT 1' > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - agent-collab-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-agent_collab}
      DB_USERNAME: ${DB_USERNAME:-agent_collab}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      GIT_PROVIDER: ${GIT_PROVIDER:-github}
      GIT_API_URL: ${GIT_API_URL:-https://api.github.com}
      GIT_TOKEN: ${GIT_TOKEN:-}
      APP_CI_WEBHOOK_SECRET: ${CI_WEBHOOK_SECRET:-}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-unconfigured}
      AGENT_API_URL: ${AGENT_API_URL:-https://api.openai.com/v1/responses}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      AGENT_REVIEW_MODEL: ${AGENT_REVIEW_MODEL:-}
      AGENT_REASONING_EFFORT: ${AGENT_REASONING_EFFORT:-}
      AGENT_DISABLE_RESPONSE_STORAGE: ${AGENT_DISABLE_RESPONSE_STORAGE:-true}
      AGENT_NETWORK_ACCESS: ${AGENT_NETWORK_ACCESS:-enabled}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-120}
      AGENT_MAX_OUTPUT_TOKENS: ${AGENT_MAX_OUTPUT_TOKENS:-12000}
      AGENT_DIAGNOSTICS_ENABLED: ${AGENT_DIAGNOSTICS_ENABLED:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/openapi || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  agent-collab-postgres:
