services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-agent_collab}
      POSTGRES_USER: ${DB_USERNAME:-agent_collab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the deployment environment}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql --host=127.0.0.1 --username=\"$${POSTGRES_USER}\" --dbname=\"$${POSTGRES_DB}\" --no-password --command='SELECT 1' > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - agent-collab-postgres:/var/lib/postgresql/data

  backend:
    image: ${IMAGE_NAMESPACE:?Set IMAGE_NAMESPACE}/${BACKEND_IMAGE:-agent-collab-backend}:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-agent_collab}
      DB_USERNAME: ${DB_USERNAME:-agent_collab}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the deployment environment}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the deployment environment}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      GIT_PROVIDER: ${GIT_PROVIDER:-github}
      GIT_API_URL: ${GIT_API_URL:-https://api.github.com}
      GIT_TOKEN: ${GIT_TOKEN:-}
      CI_WEBHOOK_SECRET: ${CI_WEBHOOK_SECRET:-}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-unconfigured}
      AGENT_API_URL: ${AGENT_API_URL:-https://api.openai.com/v1/responses}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      AGENT_REVIEW_MODEL: ${AGENT_REVIEW_MODEL:-}
      AGENT_REASONING_EFFORT: ${AGENT_REASONING_EFFORT:-}
      AGENT_DISABLE_RESPONSE_STORAGE: ${AGENT_DISABLE_RESPONSE_STORAGE:-true}
      AGENT_NETWORK_ACCESS: ${AGENT_NETWORK_ACCESS:-enabled}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-120}
      AGENT_MAX_OUTPUT_TOKENS: ${AGENT_MAX_OUTPUT_TOKENS:-12000}
      AGENT_RETRY_DELAY: ${AGENT_RETRY_DELAY:-10000}
      AGENT_RETRY_MAX_DELAY_MS: ${AGENT_RETRY_MAX_DELAY_MS:-120000}
      AGENT_RETRY_JITTER_RATIO: ${AGENT_RETRY_JITTER_RATIO:-0.25}
      AGENT_MAX_ATTEMPTS: ${AGENT_MAX_ATTEMPTS:-2}
      AGENT_DIAGNOSTICS_ENABLED: ${AGENT_DIAGNOSTICS_ENABLED:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/openapi || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    image: ${IMAGE_NAMESPACE:?Set IMAGE_NAMESPACE}/${FRONTEND_IMAGE:-agent-collab-frontend}:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    environment:
      DEPLOY_DOMAIN: ${DEPLOY_DOMAIN:?Set DEPLOY_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  agent-collab-postgres:
  caddy-data:
  caddy-config:
