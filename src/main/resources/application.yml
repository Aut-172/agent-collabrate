spring:
  application:
    name: agent-collab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agent_collab}
    username: ${DB_USERNAME:agent_collab}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

# Include SLF4J key-value pairs emitted by the Agent diagnostics logs.
logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(${LOG_LEVEL_PATTERN:%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m %kvp%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}"

app:
  agent:
    provider: ${AGENT_PROVIDER:unconfigured}
    api-url: ${AGENT_API_URL:https://api.openai.com/v1/responses}
    api-key: ${AGENT_API_KEY:}
    model: ${AGENT_MODEL:}
    review-model: ${AGENT_REVIEW_MODEL:}
    reasoning-effort: ${AGENT_REASONING_EFFORT:}
    disable-response-storage: ${AGENT_DISABLE_RESPONSE_STORAGE:true}
    network-access: ${AGENT_NETWORK_ACCESS:enabled}
    timeout-seconds: ${AGENT_TIMEOUT_SECONDS:120}
    max-output-tokens: ${AGENT_MAX_OUTPUT_TOKENS:12000}
    diagnostics-enabled: ${AGENT_DIAGNOSTICS_ENABLED:false}
    worker:
      scheduling-enabled: true
      concurrency: ${AGENT_WORKER_CONCURRENCY:4}
      queue-capacity: ${AGENT_WORKER_QUEUE_CAPACITY:0}
      poll-delay-ms: 1000
      retry-delay-ms: ${AGENT_RETRY_DELAY:10000}
      retry-max-delay-ms: ${AGENT_RETRY_MAX_DELAY_MS:120000}
      retry-jitter-ratio: ${AGENT_RETRY_JITTER_RATIO:0.25}
      lock-timeout-ms: ${AGENT_WORKER_LOCK_TIMEOUT_MS:360000}
      max-attempts: ${AGENT_MAX_ATTEMPTS:2}
  git:
    provider: ${GIT_PROVIDER:github}
    api-url: ${GIT_API_URL:https://api.github.com}
    token: ${GIT_TOKEN:}
    worker:
      poll-delay-ms: 1000
      retry-delay-ms: 1000
      lock-timeout-ms: 300000
      max-attempts: 3
  code-context:
    max-file-bytes: 200000
    max-bootstrap-files: 20
    max-indexed-summary-chars: 2000
    max-plan-inventory-files: 1000
    max-context-rounds: 2
    max-files-per-round: 20
    max-total-evidence-bytes: 1000000
    max-evidence-excerpt-chars: 4000
    git:
      api-url: ${GIT_API_URL:https://api.github.com}
      token: ${GIT_TOKEN:}
    worker:
      poll-delay-ms: 1000
      retry-delay-ms: 1000
      lock-timeout-ms: 300000
      max-attempts: 3
  ci:
    worker:
      poll-delay-ms: 5000
      retry-delay-ms: 1000
      lock-timeout-ms: 300000
      max-attempts: 3
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_EXPIRATION_MS:3600000}

springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/swagger-ui
