spring:
  application:
    name: agent-collab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agent_collab}
    username: ${DB_USERNAME:agent_collab}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  agent:
    worker:
      scheduling-enabled: true
      poll-delay-ms: 1000
      retry-delay-ms: 1000
      lock-timeout-ms: 300000
      max-attempts: 2
  git:
    worker:
      poll-delay-ms: 1000
      retry-delay-ms: 1000
      lock-timeout-ms: 300000
      max-attempts: 3
  code-context:
    max-file-bytes: 200000
    max-bootstrap-files: 20
    max-indexed-summary-chars: 2000
    git:
      api-url: ${GIT_API_URL:https://api.github.com}
      token: ${GIT_TOKEN:}
    worker:
      poll-delay-ms: 1000
      retry-delay-ms: 1000
      lock-timeout-ms: 300000
      max-attempts: 3
  ci:
    worker:
      poll-delay-ms: 5000
      retry-delay-ms: 1000
      lock-timeout-ms: 300000
      max-attempts: 3
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_EXPIRATION_MS:3600000}

springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/swagger-ui
