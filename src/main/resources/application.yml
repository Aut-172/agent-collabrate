spring:
  application:
    name: agent-collab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agent_collab}
    username: ${DB_USERNAME:agent_collab}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  agent:
    worker:
      scheduling-enabled: true
      poll-delay-ms: 1000
      retry-delay-ms: 1000
      lock-timeout-ms: 300000
      max-attempts: 2
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_EXPIRATION_MS:3600000}

springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/swagger-ui
